<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYD Telemetry</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #10141b; color: #e6e9ef;
         font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #97a3b6; margin: 0 0 24px; }
  table { border-collapse: collapse; width: 100%; max-width: 480px; margin-bottom: 32px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #232b38; }
  th { color: #97a3b6; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.value { font-variant-numeric: tabular-nums; color: #63b8b5; font-weight: 600; }
  .empty { color: #97a3b6; padding: 8px 12px; }
  section { max-width: 480px; margin-bottom: 32px; }
  section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #97a3b6; margin: 0 0 10px; }
  input[type=date] { background: #1a212c; border: 1px solid #2a3444; color: #e6e9ef; border-radius: 6px; padding: 6px 10px; font: inherit; }
  button, a.btn { background: #2a3444; border: 1px solid #3a4658; color: #e6e9ef; border-radius: 6px; padding: 6px 14px;
         font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, a.btn:hover { background: #34405480; }
  pre { background: #161c26; border: 1px solid #232b38; border-radius: 8px; padding: 12px; overflow-x: auto;
        font-size: 12.5px; max-height: 280px; }
  .status { font-size: 12.5px; color: #97a3b6; }
  select { background: #1a212c; border: 1px solid #2a3444; color: #e6e9ef; border-radius: 6px; padding: 6px 10px; font: inherit; }
  canvas { background: #161c26; border: 1px solid #232b38; border-radius: 8px; display: block; max-width: 100%; }
</style>
</head>
<body>
  <h1>CYD Telemetry</h1>
  <p class="sub">Live channel values from the companion MCU, polled every second.</p>

  <table id="data-table">
    <thead><tr><th>Channel</th><th>Value</th><th>Unit</th></tr></thead>
    <tbody id="data-body"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
  </table>

  <section>
    <h2>Live Graph</h2>
    <p><select id="graph-channel"></select> <button id="graph-clear">Clear</button></p>
    <canvas id="graph-canvas" width="440" height="180"></canvas>
    <p class="status" id="graph-status"></p>
  </section>

  <section>
    <h2>History</h2>
    <p><input type="date" id="history-date"> <button id="history-load">Load</button></p>
    <p class="status" id="history-status"></p>
    <pre id="history-out"></pre>
  </section>

  <section>
    <h2>Logs</h2>
    <table id="logs-table">
      <thead><tr><th>File</th><th>Size</th><th></th></tr></thead>
      <tbody id="logs-body"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
    <p><button id="logs-refresh">Refresh</button></p>
    <p class="status" id="logs-status"></p>
  </section>

<script>
// Client-side only — never sent to or stored on the device, which has no
// RAM to spare for another history buffer (see CLAUDE.md's DRAM budget
// note). Fed straight off the same /api/data poll the table above already
// does, so this costs nothing extra on the wire; capped per channel so an
// hours-long browser tab doesn't grow this or the redraw cost unbounded.
// Resets to empty on every page load — it only ever holds what's been
// published while this tab has been open, nothing from before or after.
const GRAPH_MAX_POINTS = 300; // ~5 min at the 1s poll rate below
const graphSeries = {};       // channel name -> [{t, v}]
const graphUnits = {};        // channel name -> latest unit seen
let graphChannel = null;

function graphFmtTime(epochSeconds) {
  return new Date(epochSeconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function graphSyncChannels(names) {
  const sel = document.getElementById('graph-channel');
  const existing = new Set(Array.from(sel.options).map(o => o.value));
  for (const name of names) {
    if (!existing.has(name)) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    }
  }
  if (graphChannel === null && names.length) {
    graphChannel = names[0];
    sel.value = graphChannel;
  }
}

function drawGraph() {
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const series = graphSeries[graphChannel] || [];
  const status = document.getElementById('graph-status');
  if (series.length < 2) {
    status.textContent = series.length ? 'Collecting…' : 'No data yet for this channel';
    return;
  }

  const values = series.map(p => p.v);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.1;
  min -= pad;
  max += pad;

  // Margins reserve room for the value labels (left) and time labels
  // (bottom) drawn below — the plot itself only ever occupies the area
  // inside them, everything else here works in that inset frame.
  const marginLeft = 54, marginRight = 8, marginTop = 6, marginBottom = 18;
  const plotW = w - marginLeft - marginRight;
  const plotH = h - marginTop - marginBottom;
  const unit = graphUnits[graphChannel] || '';

  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const gridLines = 4;
  for (let i = 0; i <= gridLines; i++) {
    const y = marginTop + (plotH / gridLines) * i;
    ctx.strokeStyle = '#232b38';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(marginLeft, Math.round(y) + 0.5);
    ctx.lineTo(marginLeft + plotW, Math.round(y) + 0.5);
    ctx.stroke();

    const value = max - ((max - min) / gridLines) * i;
    ctx.fillStyle = '#97a3b6';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(value.toFixed(1) + (unit ? ' ' + unit : ''), marginLeft - 6, y);
  }

  ctx.strokeStyle = '#63b8b5';
  ctx.lineWidth = 2;
  ctx.beginPath();
  series.forEach((p, i) => {
    const x = marginLeft + (i / (series.length - 1)) * plotW;
    const y = marginTop + plotH - ((p.v - min) / (max - min)) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Oldest and newest sample times, at the plot's left/right edges —
  // the actual window this session has accumulated, not a fixed span.
  ctx.fillStyle = '#97a3b6';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText(graphFmtTime(series[0].t), marginLeft, h - marginBottom + 4);
  ctx.textAlign = 'right';
  ctx.fillText(graphFmtTime(series[series.length - 1].t), marginLeft + plotW, h - marginBottom + 4);

  const last = series[series.length - 1];
  status.textContent =
    `${last.v.toFixed(2)}${unit ? ' ' + unit : ''} — min ${min.toFixed(2)} / max ${max.toFixed(2)} — ${series.length} pt(s) this session`;
}

document.getElementById('graph-channel').addEventListener('change', (e) => {
  graphChannel = e.target.value;
  drawGraph();
});
document.getElementById('graph-clear').addEventListener('click', () => {
  if (graphChannel !== null) graphSeries[graphChannel] = [];
  drawGraph();
});

async function refreshData() {
  const body = document.getElementById('data-body');
  try {
    const res = await fetch('/api/data');
    const rows = await res.json();
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="3" class="empty">No channels yet</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r =>
      `<tr><td>${r.name}</td><td class="value">${r.value.toFixed(2)}</td><td>${r.unit}</td></tr>`
    ).join('');

    graphSyncChannels(rows.map(r => r.name));
    for (const r of rows) {
      graphUnits[r.name] = r.unit;
      const arr = graphSeries[r.name] || (graphSeries[r.name] = []);
      arr.push({ t: r.ts_epoch, v: r.value });
      if (arr.length > GRAPH_MAX_POINTS) arr.shift();
    }
    drawGraph();
  } catch (e) {
    body.innerHTML = '<tr><td colspan="3" class="empty">Fetch failed</td></tr>';
  }
}
refreshData();
setInterval(refreshData, 1000);

document.getElementById('history-load').addEventListener('click', async () => {
  const date = document.getElementById('history-date').value;
  const status = document.getElementById('history-status');
  const out = document.getElementById('history-out');
  if (!date) { status.textContent = 'Pick a date first.'; return; }
  status.textContent = 'Loading…';
  out.textContent = '';
  try {
    const res = await fetch('/api/history?date=' + encodeURIComponent(date));
    const body = await res.json();
    if (!res.ok) {
      status.textContent = body.error || ('HTTP ' + res.status);
      return;
    }
    status.textContent = body.length + ' row(s)';
    out.textContent = JSON.stringify(body, null, 2);
  } catch (e) {
    status.textContent = 'Fetch failed';
  }
});

// Fetched once on load and on demand (the Refresh button) rather than
// polled like /api/data — the file list only changes on start/stop/
// rotate/delete, not every second, and each fetch means an SD directory
// read on the device.
async function refreshLogs() {
  const body = document.getElementById('logs-body');
  const status = document.getElementById('logs-status');
  try {
    const res = await fetch('/api/logs');
    const data = await res.json();
    const files = data.files || [];
    if (!files.length) {
      body.innerHTML = '<tr><td colspan="3" class="empty">No logs yet</td></tr>';
    } else {
      body.innerHTML = files.map(f =>
        `<tr><td>${f.name}</td><td>${(f.size / 1024).toFixed(1)} KB</td>` +
        `<td><a class="btn" href="/download?file=${encodeURIComponent(f.name)}">Download</a></td></tr>`
      ).join('');
    }
    if (typeof data.free_bytes === 'number' && typeof data.total_bytes === 'number') {
      const freeMb = Math.round(data.free_bytes / 1048576);
      const totalMb = Math.round(data.total_bytes / 1048576);
      status.textContent = `${freeMb} MB free of ${totalMb} MB`;
    } else {
      status.textContent = '';
    }
  } catch (e) {
    body.innerHTML = '<tr><td colspan="3" class="empty">Fetch failed</td></tr>';
  }
}
refreshLogs();
document.getElementById('logs-refresh').addEventListener('click', refreshLogs);
</script>
</body>
</html>
